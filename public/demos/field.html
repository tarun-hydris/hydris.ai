<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hydris Field demo</title>
<!-- Fonts: Geist + Geist Mono (the app self-hosts them). Falls back to system fonts if blocked. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0;padding:0;background:#FFFFFF}

/* ===== Hydris Field demo: everything below is scoped to .hf-demo ===== */
.hf-demo{
  --ink-950:#070C12;--ink-900:#0A1219;--ink-800:#0F1A24;
  --gold-300:#E3C69A;--gold-400:#D2A968;--gold-500:#BE8B3E;--gold-600:#9A6B24;
  --green:#34C759;--yellow:#F5B942;--red:#FF5C5C;--neutral:#5B6B7C;--danger:#F0625E;
  --ease:cubic-bezier(.32,.72,0,1);
  --bg:#0A1219;--fg:#E8ECEF;--surface:#101B26;--raised:#152230;--border:#1D2B39;
  --mute:#8C9AA7;--faint:#6c7a87;--accent:#D2A968;--accent-hi:#E3C69A;--hair:rgba(255,255,255,.06);
  --wash:rgba(255,255,255,.05);--hover:rgba(255,255,255,.035);
  --shadow:0 1px 0 0 rgba(255,255,255,.04) inset,0 12px 32px -20px rgba(3,8,14,.9);
  --btn-bg:#E8ECEF;--btn-fg:#0A1219;
  font-family:"Geist","Geist Variable",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-feature-settings:"ss01","cv11","calt";-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 16px;box-sizing:border-box;color:var(--fg)
}
.hf-demo *,.hf-demo *::before,.hf-demo *::after{box-sizing:border-box}
:where(.hf-demo) :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:where(.hf-demo) :where(input,textarea){font:inherit}
.hf-demo .hf-mono{font-family:"Geist Mono","Geist Mono Variable",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

/* phone frame */
.hf-phone{position:relative;width:392px;height:760px;border-radius:54px;padding:11px;background:#1a1f26;
  box-shadow:0 0 0 1.5px #343b45,0 0 0 4px #0b0e12,0 40px 80px -30px rgba(0,0,0,.7),0 0 120px -40px rgba(210,169,104,.25)}
.hf-screen{position:relative;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.hf-status{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:13px;font-weight:600;position:relative;z-index:5;background:rgba(10,18,25,0);color:var(--fg)}
.hf-status::before{content:"";position:absolute;left:50%;top:9px;width:92px;height:25px;border-radius:20px;background:#000;transform:translateX(-50%)}
.hf-status svg{height:11px;width:auto;fill:currentColor}
.hf-ambient{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(420px 260px at 8% -4%,rgba(210,169,104,.10),transparent 60%),radial-gradient(520px 320px at 100% 0%,rgba(76,120,160,.12),transparent 60%)}
.hf-light .hf-ambient{display:none}
.hf-light{
  --bg:#F4F3EF;--fg:#151A1F;--surface:#fff;--raised:#fff;--border:#E5E2DA;--mute:#646C74;--faint:#979EA5;
  --accent:#9A6B24;--accent-hi:#9A6B24;--hair:#E5E2DA;--wash:rgba(10,18,25,.05);--hover:rgba(10,18,25,.035);
  --shadow:0 1px 0 0 rgba(255,255,255,.9) inset,0 10px 30px -18px rgba(21,26,31,.28);--btn-bg:#0A1219;--btn-fg:#fff}

/* header */
.hf-head{flex:none;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--hair);background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px);position:relative;z-index:4}
.hf-iconbtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--mute);transition:background .2s var(--ease),color .2s}
.hf-iconbtn:hover{background:var(--wash);color:var(--fg)}
.hf-logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(145deg,#2f6bf0,#1d4ed8);display:flex;align-items:center;justify-content:center}
.hf-logo svg{width:15px;height:15px}
.hf-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hf-toggle{width:56px;height:28px;border-radius:99px;border:1px solid var(--border);background:var(--surface);position:relative;transition:background .2s}
.hf-toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#E8ECEF;color:#0A1219;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease)}
.hf-toggle i svg{width:12px;height:12px}
.hf-demo:not(.hf-light) .hf-toggle i{transform:translateX(28px)}
.hf-demotag{display:inline-flex;align-items:center;gap:6px;flex:none;border-radius:99px;border:1px solid var(--border);padding:4px 8px;font-size:11px;font-weight:500;line-height:1;color:var(--mute);white-space:nowrap}
.hf-demotag i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hf-avatar{width:30px;height:30px;border-radius:9px;border:1px solid rgba(210,169,104,.35);background:rgba(210,169,104,.1);color:var(--accent);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center}

/* main */
.hf-main{flex:1;overflow-y:auto;overflow-x:hidden;padding:24px 18px 40px;scrollbar-width:thin;scrollbar-color:rgba(140,154,167,.28) transparent}
.hf-page{animation:hf-in .48s var(--ease) both}
@keyframes hf-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hf-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hf-rise{animation:hf-rise .42s var(--ease) both}
.hf-eyebrow{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--mute);margin:0;font-weight:400}
.hf-date{font-size:14px;color:var(--mute);margin:0 0 6px}
.hf-title{font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.025em;margin:0 0 22px;text-wrap:balance}
.hf-panel{border-radius:18px;border:1px solid var(--hair);background:var(--surface);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.hf-panel>.hf-eyebrow{margin-bottom:16px}
.hf-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.hf-tile{border-radius:14px;border:1px solid var(--hair);background:var(--surface);padding:12px 12px 10px;box-shadow:var(--shadow)}
.hf-tile b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
.hf-tile .hf-eyebrow{display:block;font-size:9px;letter-spacing:.06em;white-space:nowrap}

/* lists */
.hf-list{list-style:none;margin:0;padding:0}
.hf-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:10px;transition:background .2s var(--ease)}
.hf-row:hover{background:var(--hover)}
.hf-row{position:relative}
.hf-row+.hf-row::before{content:"";position:absolute;top:0;left:8px;right:8px;height:1px;background:var(--border)}
.hf-row .l{display:flex;align-items:center;gap:12px;min-width:0}
.hf-chip{flex:none;min-width:58px;text-align:center;border-radius:8px;background:var(--wash);padding:4px 8px;font-size:11px;color:var(--mute)}
.hf-row .t{min-width:0}
.hf-row .t p{margin:0}.hf-row .n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.hf-row .s{font-size:12px;color:var(--mute);margin-top:2px!important}
.hf-row .n{line-height:1.3}
.hf-row .e{font-size:10px;flex:none}
.hf-sub{margin:0 0 4px}.hf-sub.od{color:var(--danger)}
.hf-gap{height:16px}
.hf-hint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent-hi);margin:0 0 14px}
.hf-dashhint{margin-top:-8px}
.hf-hint::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(210,169,104,.6);animation:hf-pulse 1.8s infinite}
@keyframes hf-pulse{70%{box-shadow:0 0 0 8px rgba(210,169,104,0)}100%{box-shadow:0 0 0 0 rgba(210,169,104,0)}}

/* status chip: hairline + dot */
.hf-st{display:inline-flex;align-items:center;gap:6px;border-radius:99px;border:1px solid;padding:3px 8px;font-size:11px;font-weight:500;line-height:1;white-space:nowrap}
.hf-st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.hf-st.draft{border-color:var(--border);color:var(--mute)}
.hf-st.submitted{border-color:rgba(245,158,11,.35);color:#d97706}
.hf-st.reviewed{border-color:rgba(14,165,233,.35);color:#0ea5e9}
.hf-st.approved{border-color:rgba(16,185,129,.35);color:#10b981}
.hf-demo:not(.hf-light) .hf-st.submitted{color:#fcd34d}.hf-demo:not(.hf-light) .hf-st.reviewed{color:#7dd3fc}.hf-demo:not(.hf-light) .hf-st.approved{color:#6ee7b7}

/* buttons */
.hf-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap;
  background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 10px 24px -14px rgba(232,236,239,.45);transition:transform .2s var(--ease),background .2s,opacity .2s}
.hf-light .hf-btn{box-shadow:0 10px 24px -14px rgba(10,18,25,.8)}
.hf-btn:hover{transform:translateY(-1px)}.hf-btn:active{transform:scale(.98)}
.hf-btn.sec{background:var(--raised);color:var(--fg);border:1px solid var(--border);box-shadow:none}
.hf-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.hf-btn.full{width:100%}
.hf-btn svg{width:16px;height:16px}
.hf-demo :focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:none}
.hf-demo .hf-input:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(210,169,104,.35)}
.hf-demo .hf-main:focus-visible{outline:none}
.hf-actions{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--border);padding-top:16px;margin-top:6px}

/* visit view */
.hf-back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--mute);margin:-6px 0 12px -4px;padding:4px 6px;border-radius:8px}
.hf-back:hover{color:var(--fg);background:var(--wash)}.hf-back svg{width:16px;height:16px}
.hf-crumb{margin-bottom:6px}
.hf-title.sm{font-size:26px;margin-bottom:16px}
.hf-steps{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:18px;font-size:12px}
.hf-step{display:flex;align-items:center;gap:8px;color:var(--faint)}
.hf-step .c{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .2s var(--ease)}
.hf-step .c svg{width:13px;height:13px}
.hf-step.on{color:var(--fg);font-weight:500}.hf-step.on .c{border-color:var(--accent);background:rgba(210,169,104,.1);color:var(--accent-hi)}
.hf-step.done{color:var(--mute)}.hf-step.done .c{color:var(--mute)}
.hf-step+.hf-line{width:22px;height:1px;background:var(--border)}
.hf-voice{display:flex;align-items:center;gap:12px;border-radius:14px;border:1px dashed var(--border);padding:12px;margin-bottom:14px;min-height:68px}
.hf-mic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--raised);border:1px solid var(--border);color:var(--accent-hi);display:flex;align-items:center;justify-content:center;position:relative;transition:transform .2s var(--ease)}
.hf-mic svg{width:20px;height:20px}.hf-mic:hover{transform:scale(1.05)}
.hf-mic.rec{background:var(--danger);border-color:var(--danger);color:#fff}
.hf-mic.rec::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--danger);opacity:.5;animation:hf-ring 1.2s infinite}
@keyframes hf-ring{from{transform:scale(.85);opacity:.7}to{transform:scale(1.3);opacity:0}}
.hf-voice p{margin:0;font-size:13px;line-height:1.45;color:var(--mute)}
.hf-voice p.tx{color:var(--fg);font-style:italic}
.hf-voice b{display:block;font-size:13px;font-weight:500;color:var(--fg);margin-bottom:2px}
.hf-grid{border-radius:18px;border:1px solid var(--hair);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.hf-prm{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;transition:background .25s var(--ease)}
.hf-prm+.hf-prm{border-top:1px solid var(--border)}
.hf-prm .nm{font-size:14px;font-weight:500;line-height:1.25}
.hf-prm .nm small{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:3px}
.hf-prm .nm small span{opacity:.9}
.hf-prm .u{font-size:12px;color:var(--faint);font-weight:400}
.hf-prm .in{display:flex;align-items:center;gap:8px;flex:none}
.hf-dot{width:8px;height:8px;border-radius:50%;background:var(--neutral);transition:background .25s;flex:none}
.hf-prm.green{background:rgba(52,199,89,.08)}.hf-prm.green .hf-dot{background:var(--green)}
.hf-prm.yellow{background:rgba(245,185,66,.1)}.hf-prm.yellow .hf-dot{background:var(--yellow)}
.hf-prm.red{background:rgba(255,92,92,.1)}.hf-prm.red .hf-dot{background:var(--red)}
.hf-prm.neutral{background:rgba(91,107,124,.08)}
.hf-input{width:96px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--raised);color:var(--fg);text-align:right;padding:0 10px;font-size:13px;transition:border-color .2s,box-shadow .2s}
.hf-light .hf-input{box-shadow:0 1px 2px rgba(21,26,31,.04)}
.hf-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(210,169,104,.25)}
.hf-input::placeholder{color:var(--faint)}
.hf-lsi .v{font-size:13px;padding-right:2px;text-align:right;min-width:96px}
.hf-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin:2px 2px 14px}
.hf-legend span{display:inline-flex;align-items:center;gap:6px}
.hf-flash{animation:hf-flash .7s var(--ease)}
@keyframes hf-flash{from{box-shadow:inset 0 0 0 2px rgba(210,169,104,.7)}to{box-shadow:inset 0 0 0 2px transparent}}

/* checklist */
.hf-prog{height:4px;border-radius:99px;background:var(--wash);overflow:hidden;margin:10px 0 18px}
.hf-prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s var(--ease)}
.hf-chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;font-size:14px;min-height:48px;transition:color .2s}
.hf-chk+.hf-chk{border-top:1px solid var(--border)}
.hf-box{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .2s var(--ease)}
.hf-box svg{width:14px;height:14px}
.hf-chk.on .hf-box{background:var(--accent);border-color:var(--accent);color:#0A1219}
.hf-chk.on span.tx{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(140,154,167,.5)}

/* AI report */
.hf-ai-go{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:10px 0}
.hf-ai-go p{margin:0;font-size:13px;line-height:1.5;color:var(--mute);max-width:280px}
.hf-orb{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--accent-hi);background:rgba(210,169,104,.1);border:1px solid rgba(210,169,104,.3)}
.hf-orb svg{width:24px;height:24px}
.hf-think{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.hf-think li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);opacity:.45;transition:opacity .3s}
.hf-think li.on,.hf-think li.ok{opacity:1}.hf-think li.ok{color:var(--fg)}
.hf-think .sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center}
.hf-think li.on .sp{border-color:var(--accent);border-top-color:transparent;animation:hf-spin .8s linear infinite}
.hf-think li.ok .sp{border:0;background:var(--green);color:#06210f}.hf-think li.ok .sp svg{width:11px;height:11px}
@keyframes hf-spin{to{transform:rotate(360deg)}}
.hf-ai-badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;border:1px solid rgba(210,169,104,.35);color:var(--accent-hi);padding:4px 10px;font-size:11px;margin-bottom:14px}
.hf-ai-badge svg{width:12px;height:12px}
.hf-sec{margin-bottom:16px}.hf-sec .hf-eyebrow{margin-bottom:6px}
.hf-sec p,.hf-sec li{margin:0;font-size:13.5px;line-height:1.55;color:var(--fg)}
.hf-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.hf-sec .bad{color:var(--red)}.hf-sec .warn{color:var(--yellow)}
.hf-light .hf-sec .warn{color:#b97d0b}.hf-light .hf-sec .bad{color:#d33}
.hf-src{font-size:11px;color:var(--faint);margin:2px 0 16px}
.hf-done{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 10px;text-align:center}
.hf-done svg{width:34px;height:34px;color:var(--green)}.hf-done p{margin:0;font-size:15px;font-weight:500}

/* drawer */
.hf-scrim{position:absolute;inset:0;z-index:20;background:rgba(7,12,18,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.hf-drawer{position:absolute;top:0;bottom:0;left:0;width:272px;z-index:21;background:var(--bg);border-right:1px solid var(--hair);padding:48px 12px 20px;overflow-y:auto;transform:translateX(-102%);visibility:hidden;transition:transform .35s var(--ease),visibility 0s .35s;box-shadow:0 24px 60px -24px rgba(3,8,14,.85)}
.hf-open .hf-scrim{opacity:1;pointer-events:auto}.hf-open .hf-drawer{transform:none;visibility:visible;transition:transform .35s var(--ease),visibility 0s}
.hf-brand{display:flex;align-items:center;gap:12px;padding:6px 12px 22px}
.hf-brand .mk{width:36px;height:36px;border-radius:11px;background:var(--wash);box-shadow:0 0 0 1px var(--hair);display:flex;align-items:center;justify-content:center}
.hf-brand .mk .hf-logo{width:20px;height:20px;border-radius:5px}.hf-brand .mk svg{width:13px;height:13px}
.hf-brand b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.hf-brand small{display:block;margin-top:5px;font-family:"Geist Mono",monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.hf-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.hf-nav .hf-eyebrow{font-size:10px;letter-spacing:.2em;padding:0 16px;margin-bottom:8px}
.hf-link{position:relative;display:block;width:100%;text-align:left;padding:8px 12px 8px 16px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--mute);transition:background .2s var(--ease),color .2s var(--ease),transform .2s var(--ease)}
.hf-link:hover{background:var(--hover);color:var(--fg);transform:translateX(1px)}
.hf-link::before{content:"";position:absolute;left:0;top:50%;width:3px;height:16px;border-radius:99px;background:var(--accent);transform:translateY(-50%);opacity:0;transition:opacity .2s}
.hf-link.on{background:var(--wash);color:var(--fg)}.hf-link.on::before{opacity:1}
.hf-link.off{opacity:.5;cursor:default}.hf-link.off:hover{background:none;transform:none;color:var(--mute)}

/* toast */
.hf-toast{position:absolute;left:16px;right:16px;bottom:22px;z-index:30;border-radius:14px;border:1px solid var(--hair);background:var(--raised);box-shadow:0 24px 60px -24px rgba(3,8,14,.85);padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;transform:translateY(220%);opacity:0;transition:transform .4s var(--ease),opacity .3s}
.hf-toast.show{transform:none;opacity:1}.hf-toast svg{width:18px;height:18px;color:var(--green);flex:none}
.hf-caption{font-size:13px;color:#5B6B7C;text-align:center;max-width:392px;margin:0;line-height:1.5}
.hf-caption b{color:#9A6B24;font-weight:500}

@media (max-width:480px){
  .hf-demo{padding:12px 0}
  .hf-phone{width:calc(100% - 16px);height:720px;border-radius:36px;padding:8px}
  .hf-screen{border-radius:29px}
  .hf-status::before{width:78px;height:22px;top:8px}
  .hf-status{padding:6px 20px 0}

      <header class="hf-head">

<script>
(function(){
"use strict";
var root=document.getElementById("hfDemo"),screen=document.getElementById("hfScreen"),main=document.getElementById("hfMain"),
    drawer=document.getElementById("hfDrawer"),toast=document.getElementById("hfToast");
var timers=[];function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

/* ---- icons ---- */
var I={
 chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
 mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>',
 spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 circleOk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/></svg>'
};
var LOGO='<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2.5l5.6 5.6L12 13.7 6.4 8.1z"/><path d="M12 10.3l5.6 5.6L12 21.5l-5.6-5.6z" opacity=".78"/></svg>';
document.querySelectorAll("[data-logo]").forEach(function(e){e.innerHTML=LOGO});

/* ---- mock data ---- */
var now=new Date();
function dAgo(n){var d=new Date(now);d.setDate(d.getDate()-n);return d}
function fmtD(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
var VISITS={
 overdue:[{id:"v1",site:"Site A Cooling Tower 2",cust:"Customer A",tech:"Technician A",when:fmtD(dAgo(5))},
          {id:"v2",site:"Site B Cooling Tower 1",cust:"Customer B",tech:"Technician A",when:fmtD(dAgo(4))},
          {id:"v3",site:"Site C Cooling Tower A",cust:"Customer C",tech:"Technician A",when:fmtD(dAgo(1))}],
 today:[{id:"v4",site:"Site C Chiller Loop",cust:"Customer C",tech:"Technician A",when:"9:30 AM"},
        {id:"v5",site:"Site A Cooling Tower 1",cust:"Customer A",tech:"Technician A",when:"1:00 PM"}]
};
var REPORTS=[
 {no:"RPT-0148",site:"Site B Cooling Tower 2",st:"approved",by:"Technician A",when:fmtD(dAgo(3))},
 {no:"RPT-0147",site:"Site C Boiler Feed",st:"reviewed",by:"Technician A",when:fmtD(dAgo(3))},
 {no:"RPT-0146",site:"Site A Cooling Tower 1",st:"submitted",by:"Technician B",when:fmtD(dAgo(6))},
 {no:"RPT-0145",site:"Site B Cooling Tower 1",st:"draft",by:"Technician B",when:fmtD(dAgo(7))}
];
var OOR=[{n:"Free chlorine",s:"Site B CT 1",v:"0.05 ppm",c:"red"},{n:"Alkalinity",s:"Site A Cooling Tower 2",v:"392 ppm",c:"yellow"},{n:"Conductivity",s:"Site C CT A",v:"3,140 µS/cm",c:"red"}];
/* control range + warning band per parameter */
var P=[
 {k:"ph",n:"pH",u:"",a:7.5,b:8.8,wa:7.2,wb:9.0,prev:8.1,dp:2},
 {k:"cond",n:"Conductivity",u:"µS/cm",a:1500,b:2800,wa:1300,wb:3000,prev:2080,dp:0},
 {k:"alk",n:"Total alkalinity",u:"ppm",a:150,b:350,wa:120,wb:400,prev:235,dp:0},
 {k:"ca",n:"Calcium hardness",u:"ppm",a:200,b:600,wa:150,wb:700,prev:395,dp:0},
 {k:"cl",n:"Free chlorine",u:"ppm",a:.2,b:1,wa:.1,wb:1.5,prev:.5,dp:2}
];
var LSI_R={a:0,b:2,wa:-.5,wb:2.5};
var CHECK=["Inspect basin and fill valve","Check biocide feed pump","Verify blowdown controller","Inspect fan and drift eliminators","Sample recirculating water","Test make-up water","Record meter readings","Photograph nameplate"];

/* ---- state ---- */
var S={screen:"dash",visit:null,tab:0,theme:"light",read:null,chk:null,voice:0,ai:0,submitted:false,reports:REPORTS.slice()};
function freshVisit(v){S.visit=v;S.tab=0;S.read={ph:8.9,cond:2150,alk:240,ca:410,cl:null};S.chk=[1,1,0,0,0,0,0,0];S.voice=0;S.ai=0;S.submitted=false}

/* ---- chemistry (mirrors the app's evaluateColor) ---- */
function color(v,r){if(v===null||isNaN(v))return"neutral";if(v>=r.a&&v<=r.b)return"green";if(v>=r.wa&&v<=r.wb)return"yellow";return"red"}
function lsi(){var r=S.read;if(["ph","cond","alk","ca"].some(function(k){return r[k]===null||r[k]<=0}))return null;
 var tds=r.cond*.65,T=32,A=(Math.log10(tds)-1)/10,B=-13.12*Math.log10(T+273)+34.55,C=Math.log10(r.ca)-.4,D=Math.log10(r.alk);
 return r.ph-((9.3+A+B)-(C+D))}
function fmt(v,dp){return v===null?"":Number(v).toFixed(dp)}
function pad(v){return v}

/* ---- views ---- */
function st(s){var L={draft:"Draft",submitted:"Submitted",reviewed:"Reviewed",approved:"Approved"};return'<span class="hf-st '+s+'"><i></i>'+L[s]+'</span>'}
function visitRow(v,od){return'<button class="hf-row" data-act="open" data-id="'+v.id+'"><span class="l"><span class="hf-chip hf-mono">'+v.when+'</span><span class="t"><p class="n">'+v.site+'</p><p class="s">'+v.tech+'</p></span></span><span class="hf-eyebrow e">Scheduled</span></button>'}
function dash(){
 var d=now.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
 return'<div class="hf-page"><p class="hf-date">'+d+'</p><h1 class="hf-title">Dashboard</h1>'+
 '<div class="hf-tiles"><div class="hf-tile"><span class="hf-eyebrow">Active sites</span><b class="hf-mono">24</b></div><div class="hf-tile"><span class="hf-eyebrow">Overdue</span><b class="hf-mono" style="color:var(--danger)">3</b></div><div class="hf-tile"><span class="hf-eyebrow">Open reports</span><b class="hf-mono">7</b></div></div>'+
 '<div class="hf-hint hf-dashhint">Tap a visit to start a service report</div>'+
 '<section class="hf-panel"><h2 class="hf-eyebrow">Today’s visits</h2>'+
 '<p class="hf-eyebrow hf-sub od">Overdue ('+VISITS.overdue.length+')</p><div class="hf-list">'+VISITS.overdue.map(visitRow).join("")+'</div><div class="hf-gap"></div>'+
 '<p class="hf-eyebrow hf-sub">Today</p><div class="hf-list">'+VISITS.today.map(visitRow).join("")+'</div></section>'+
 '<section class="hf-panel"><h2 class="hf-eyebrow">Out of range</h2><div class="hf-list">'+OOR.map(function(o){return'<div class="hf-row" style="cursor:default"><span class="l"><span class="hf-dot" style="background:var(--'+(o.c==="red"?"red":"yellow")+')"></span><span class="t"><p class="n">'+o.n+'</p><p class="s">'+o.s+'</p></span></span><span class="hf-mono" style="font-size:12.5px">'+o.v+'</span></div>'}).join("")+'</div></section></div>'}
function reports(){
 return'<div class="hf-page"><h1 class="hf-title">Reports</h1><section class="hf-panel" style="padding:12px 20px"><div class="hf-list">'+S.reports.map(function(r,i){return'<div class="hf-row'+(i===0&&r.fresh?" hf-rise":"")+'" style="cursor:default;flex-wrap:wrap"><span class="t"><p class="hf-mono" style="font-size:11px;color:var(--mute);margin-bottom:3px">'+r.no+'</p><p class="n" style="max-width:200px">'+r.site+'</p><p class="s">'+r.by+' · '+r.when+'</p></span>'+st(r.st)+'</div>'}).join("")+'</div></section></div>'}
function steps(){var L=["Results","Checklist","AI report"],h='<div class="hf-steps">';
 L.forEach(function(l,i){var c=i===S.tab?"on":i<S.tab?"done":"";h+='<button class="hf-step '+c+'" data-act="tab" data-i="'+i+'"><span class="c hf-mono">'+(i<S.tab?I.check:i+1)+'</span>'+l+'</button>'+(i<2?'<span class="hf-line"></span>':'')});
 return h+'</div>'}
function head(){return'<div class="hf-page"><button class="hf-back" data-act="nav" data-to="dash">'+I.chevL+'Dashboard</button><p class="hf-eyebrow hf-crumb">'+S.visit.cust+' · Visit</p><h1 class="hf-title sm">'+S.visit.site+'</h1>'+steps()}
function voiceCard(){
 var m=S.voice===0?'<b>Voice-to-data</b><p>Tap the mic and read your results aloud. Hydris fills the grid.</p>':S.voice===1?'<b>Listening…</b><p class="tx" id="hfTx"></p>':'<b>Heard and filled 5 readings</b><p class="tx" id="hfTx">“'+VOICE+'”</p>';
 return'<div class="hf-voice"><button class="hf-mic'+(S.voice===1?" rec":"")+'" data-act="voice" aria-label="Dictate readings">'+I.mic+'</button><div>'+m+'</div></div>'}
var VOICE="pH eight point two, conductivity twenty two forty, alkalinity two sixty two, calcium four eighteen, free chlorine point six.";
var VOICEVAL={ph:8.2,cond:2240,alk:262,ca:418,cl:.6};
function prow(p){var v=S.read[p.k];return'<div class="hf-prm '+color(v,p)+'" data-row="'+p.k+'"><div class="nm">'+p.n+(p.u?' <span class="u hf-mono">('+p.u+')</span>':'')+'<small class="hf-mono">prev '+p.prev+' · range '+p.a+'–'+p.b+'</small></div><div class="in"><span class="hf-dot"></span><input class="hf-input hf-mono" type="number" inputmode="decimal" step="any" data-k="'+p.k+'" aria-label="'+p.n+'" placeholder="Enter" value="'+(v===null?"":v)+'"></div></div>'}
function lsiRow(){var v=lsi(),c=v===null?"neutral":color(v,LSI_R);return'<div class="hf-prm hf-lsi '+c+'" id="hfLsi"><div class="nm">LSI <span class="u hf-mono">· calculated</span><small class="hf-mono">range 0–2.0 · scale index</small></div><div class="in"><span class="hf-dot"></span><span class="v hf-mono">'+(v===null?"insufficient data":v.toFixed(2))+'</span></div></div>'}
function results(){return head()+voiceCard()+'<div class="hf-grid">'+P.map(prow).join("")+lsiRow()+'</div><div class="hf-legend"><span><i class="hf-dot" style="background:var(--green)"></i>In range</span><span><i class="hf-dot" style="background:var(--yellow)"></i>Warning</span><span><i class="hf-dot" style="background:var(--red)"></i>Out of range</span><span><i class="hf-dot"></i>No value</span></div><div class="hf-hint">Try changing a value to see it change colour</div><div class="hf-actions"><button class="hf-btn" data-act="tab" data-i="1">Continue</button></div></div>'}
function checklist(){var n=S.chk.reduce(function(a,b){return a+b},0);
 return head()+'<section class="hf-panel"><h2 class="hf-eyebrow">Cooling tower checklist</h2><p class="hf-mono" style="margin:12px 0 0;font-size:12px;color:var(--mute)" id="hfChkN">'+n+' of '+CHECK.length+' complete</p><div class="hf-prog"><i id="hfBar" style="width:'+n/CHECK.length*100+'%"></i></div>'+
 CHECK.map(function(t,i){return'<button class="hf-chk'+(S.chk[i]?" on":"")+'" data-act="chk" data-i="'+i+'"><span class="hf-box">'+I.check+'</span><span class="tx">'+t+'</span></button>'}).join("")+'</section><div class="hf-actions"><button class="hf-btn sec" data-act="tab" data-i="0">Back</button><button class="hf-btn" data-act="tab" data-i="2">Continue</button></div></div>'}
function counts(){var o=0,w=0;P.forEach(function(p){var c=color(S.read[p.k],p);if(c==="red")o++;if(c==="yellow")w++});return{o:o,w:w}}
function aiTab(){
 if(S.submitted)return head()+'<div class="hf-panel hf-done hf-rise">'+I.circleOk+'<p>Report <span class="hf-mono">RPT-0149</span> submitted</p><span class="hf-eyebrow" style="max-width:240px;line-height:1.6">Sent to Operations for review. No retyping needed.</span><button class="hf-btn sec" style="margin-top:8px" data-act="nav" data-to="reports">View reports</button></div></div>';
 if(S.ai===0)return head()+'<section class="hf-panel"><div class="hf-ai-go"><span class="hf-orb">'+I.spark+'</span><p>Hydris drafts the full service report from your readings, checklist and voice notes.</p><button class="hf-btn full" data-act="gen">'+I.spark+'Generate AI report</button></div></section><div class="hf-actions"><button class="hf-btn sec" data-act="tab" data-i="1">Back</button></div></div>';
 if(S.ai===1)return head()+'<section class="hf-panel"><h2 class="hf-eyebrow">Drafting report</h2><ul class="hf-think" id="hfThink"><li>Reading test results</li><li>Checking control ranges and LSI</li><li>Reviewing checklist and notes</li><li>Writing sections</li></ul></section></div>';
 return head()+reportDoc()}
function reportDoc(){
 var c=counts(),L=lsi(),n=S.chk.reduce(function(a,b){return a+b},0),
 bad=[];P.forEach(function(p){var v=S.read[p.k],cl=color(v,p);if(cl==="red"||cl==="yellow")bad.push('<li class="'+(cl==="red"?"bad":"warn")+'">'+p.n+' '+v+(p.u?" "+p.u:"")+' is '+(cl==="red"?"outside":"near the edge of")+' the '+p.a+'–'+p.b+' control range.</li>')});
 var lc=L===null?"neutral":color(L,LSI_R);if(lc!=="green"&&L!==null)bad.push('<li class="'+(lc==="red"?"bad":"warn")+'">LSI '+L.toFixed(2)+' indicates '+(L>LSI_R.b?"scale-forming":"corrosive")+' water.</li>');
 var good=c.o+c.w===0&&lc!=="red"&&lc!=="yellow";
 var rec=good?["Maintain the current blowdown and biocide programme.","Re-test all parameters at the next scheduled visit."]:["Review the "+(P.filter(function(p){return S.read.ph>p.b&&p.k==="ph"}).length?"acid feed setpoint to bring pH down":"flagged parameters")+" and adjust inhibitor dosing.","Increase blowdown cycles until conductivity and LSI return in range.","Re-test within 7 days."];
 return'<div class="hf-rise"><span class="hf-ai-badge">'+I.spark+'AI draft · review before submitting</span>'+
 '<div class="hf-sec"><h3 class="hf-eyebrow">Summary</h3><p>Routine service visit at '+S.visit.site+'. '+(good?"All measured parameters are within control ranges.":(c.o?c.o+" parameter"+(c.o>1?"s are":" is")+" out of range"+(c.w?" and "+c.w+" in the warning band":"")+".":c.w+" parameter"+(c.w>1?"s are":" is")+" in the warning band."))+' '+n+' of '+CHECK.length+' checklist items completed.</p></div>'+
 '<div class="hf-sec"><h3 class="hf-eyebrow">Water chemistry findings</h3>'+(bad.length?'<ul>'+bad.join("")+'</ul>':'<p>pH, conductivity, alkalinity, hardness and chlorine are all in range. LSI '+(L===null?"not available":L.toFixed(2))+'.</p>')+'</div>'+
 '<div class="hf-sec"><h3 class="hf-eyebrow">Recommendations</h3><ul>'+rec.map(function(r){return"<li>"+r+"</li>"}).join("")+'</ul></div>'+
 '<div class="hf-sec"><h3 class="hf-eyebrow">Next visit</h3><p>Scheduled in 14 days'+(good?"":", with a follow-up re-test in 7 days")+'.</p></div>'+
 '<p class="hf-src hf-mono">Drafted from 5 readings · '+n+' checklist items'+(S.voice===2?" · 1 voice note":"")+'</p>'+
 '<div class="hf-actions"><button class="hf-btn sec" data-act="regen">Regenerate</button><button class="hf-btn" data-act="submit">Submit report</button></div></div></div>'}

/* ---- navigation drawer ---- */
function drawerHtml(){
 function lk(l,to,on){return to?'<button class="hf-link'+(on?" on":"")+'" data-act="nav" data-to="'+to+'">'+l+'</button>':'<span class="hf-link off">'+l+'</span>'}
 var sc=S.screen;
 return'<div class="hf-brand"><span class="mk"><span class="hf-logo">'+LOGO+'</span></span><span><b>Hydris Field</b><small>Field console</small></span></div>'+
 '<nav class="hf-nav"><span class="hf-eyebrow">Main</span>'+lk("Dashboard","dash",sc==="dash")+lk("Reports","reports",sc==="reports")+lk("New Report","new",sc==="visit")+lk("Water Chemistry")+'</nav>'+
 '<nav class="hf-nav"><span class="hf-eyebrow">Operations</span>'+lk("Schedule")+lk("Route Optimization")+lk("Voice-to-Data")+'</nav>'+
 '<nav class="hf-nav"><span class="hf-eyebrow">Intelligence</span>'+lk("Analytics")+lk("Predictive Alerts")+lk("AI Copilot")+'</nav>'}

/* ---- render ---- */
/* keyboard focus survives re-renders: refocus the same control, or the first control on the new screen */
var KBD=false;
document.addEventListener("keydown",function(){KBD=true},true);
document.addEventListener("pointerdown",function(){KBD=false},true);
function render(keepScroll){
 var ae=document.activeElement,fin=KBD&&ae&&ae!==document.body&&(main.contains(ae)||drawer.contains(ae)),fsel=null;
 if(fin&&ae.dataset&&ae.dataset.act)fsel='[data-act="'+ae.dataset.act+'"]'+(ae.dataset.i!=null?'[data-i="'+ae.dataset.i+'"]':'')+(ae.dataset.to?'[data-to="'+ae.dataset.to+'"]':'');
 clearTimers();var y=keepScroll?main.scrollTop:0;
 main.innerHTML=S.screen==="dash"?dash():S.screen==="reports"?reports():S.tab===0?results():S.tab===1?checklist():aiTab();
 main.scrollTop=y;drawer.innerHTML=drawerHtml();
 if(fin){var el=(fsel&&main.querySelector(fsel))||main.querySelector("button,input")||main;if(el)try{el.focus({preventScroll:true})}catch(e){}}
 if(S.screen==="visit"&&S.tab===2&&S.ai===1)runThink();
 if(S.screen==="visit"&&S.tab===0&&S.voice===1)runVoice();
}
function go(to){screen.classList.remove("hf-open");
 if(to==="new"){freshVisit({id:"v1",site:"Site A Cooling Tower 2",cust:"Customer A"});S.screen="visit"}else S.screen=to;render()}
function runThink(){var li=main.querySelectorAll("#hfThink li");
 li.forEach(function(el,i){el.insertAdjacentHTML("afterbegin",'<span class="sp"></span>');
  later(function(){el.className="on"},i*850);later(function(){el.className="ok";el.querySelector(".sp").innerHTML=I.check},i*850+780)});
 later(function(){S.ai=2;render()},li.length*850+250)}
function runVoice(){var tx=document.getElementById("hfTx"),i=0;
 (function step(){i+=2;tx.textContent="“"+VOICE.slice(0,i)+(i<VOICE.length?"…":"”");
  if(i<VOICE.length)later(step,28);else later(function(){
   S.voice=2;Object.assign(S.read,VOICEVAL);render(true);
   main.querySelectorAll(".hf-prm").forEach(function(r,n){later(function(){r.classList.add("hf-flash")},n*90)})},500)})()}
function toastMsg(m){toast.innerHTML=I.circleOk+"<span>"+m+"</span>";toast.classList.add("show");setTimeout(function(){toast.classList.remove("show")},2800)}

/* ---- events ---- */
root.addEventListener("click",function(e){
 var t=e.target.closest("[data-act]");if(!t||!root.contains(t))return;var a=t.dataset.act;
 if(a==="drawer"){screen.classList.toggle("hf-open");if(KBD&&screen.classList.contains("hf-open")){var f=drawer.querySelector("button");if(f)try{f.focus({preventScroll:true})}catch(_){}}}
 else if(a==="theme"){S.theme=S.theme==="dark"?"light":"dark";root.classList.toggle("hf-light",S.theme==="light");themeIcon()}
 else if(a==="nav")go(t.dataset.to);
 else if(a==="open"){var all=VISITS.overdue.concat(VISITS.today),v=all.filter(function(x){return x.id===t.dataset.id})[0];freshVisit(v);S.screen="visit";render()}
 else if(a==="tab"){S.tab=+t.dataset.i;render()}
 else if(a==="chk"){var i=+t.dataset.i;S.chk[i]=S.chk[i]?0:1;t.classList.toggle("on");var n=S.chk.reduce(function(x,y){return x+y},0);
   document.getElementById("hfChkN").textContent=n+" of "+CHECK.length+" complete";document.getElementById("hfBar").style.width=n/CHECK.length*100+"%"}
 else if(a==="voice"){if(S.voice===1)return;S.voice=1;render(true)}
 else if(a==="gen"||a==="regen"){S.ai=1;render()}
 else if(a==="submit"){S.submitted=true;S.reports.unshift({no:"RPT-0149",site:S.visit.site,st:"submitted",by:"Technician A",when:fmtD(now),fresh:true});render();toastMsg("Report submitted to Operations")}
});
root.addEventListener("input",function(e){var el=e.target;if(!el.dataset||!el.dataset.k)return;var k=el.dataset.k,p=P.filter(function(x){return x.k===k})[0];
 var v=el.value===""?null:parseFloat(el.value);S.read[k]=isNaN(v)?null:v;
 var row=el.closest(".hf-prm");row.className="hf-prm "+color(S.read[k],p);
 var l=document.getElementById("hfLsi");if(l){l.outerHTML=lsiRow()}});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&screen.classList.contains("hf-open")){screen.classList.remove("hf-open");if(drawer.contains(document.activeElement))root.querySelector('.hf-head [data-act="drawer"]').focus()}});
function themeIcon(){var i=root.querySelector("[data-theme-icon]");i.innerHTML=S.theme==="dark"?I.moon:I.sun}
function clock(){var d=new Date();document.getElementById("hfClock").textContent=((d.getHours()%12)||12)+":"+("0"+d.getMinutes()).slice(-2)}
clock();setInterval(clock,30000);themeIcon();render();
})();
</script>
<script>
/* Embedding: report this document's height to the host page so it can size the iframe. */
(function(){
  var DEMO='field',raf=0;
  if(window.parent===window)return;
  function height(){
    var b=document.body,d=document.documentElement;
    /* body height, not documentElement.scrollHeight alone: the root can never report less than the current iframe height */
    return Math.ceil(Math.max(b.scrollHeight,b.getBoundingClientRect().height))||d.scrollHeight;
  }
  function post(){raf=0;try{window.parent.postMessage({type:'hydris-demo-height',demo:DEMO,height:height()},'*')}catch(e){}}
  function schedule(){if(!raf)raf=window.requestAnimationFrame(post)}
  window.addEventListener('load',schedule);
  window.addEventListener('resize',schedule);
  if(window.ResizeObserver){try{new ResizeObserver(schedule).observe(document.body)}catch(e){}}
  schedule();
})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hydris Lite demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   Hydris Lite demo. Sample data only. Everything is scoped under .hl-demo.
   =================================================================== */
html,body{margin:0;padding:0;background:#FFFFFF}
.hl-demo{
  --bg:#f6f7f9;--panel:#fff;--panel-2:#fbfbfc;--line:#e6e8ec;--line-2:#eef0f3;--mute:#cfd4da;
  --ink:#0e1620;--ink-2:#38424e;--ink-3:#6b7682;--ink-4:#9aa3ad;
  --teal:oklch(0.62 0.09 210);--teal-ink:oklch(0.42 0.08 210);--teal-bg:oklch(0.96 0.02 210);--teal-50:oklch(0.97 0.015 210);--teal-600:oklch(0.55 0.085 210);
  --ok:oklch(0.64 0.12 150);--ok-bg:oklch(0.96 0.03 150);--ok-ink:oklch(0.50 0.11 150);
  --warn:oklch(0.72 0.13 75);--warn-bg:oklch(0.96 0.05 80);--warn-ink:oklch(0.50 0.12 75);
  --risk:oklch(0.60 0.17 30);--risk-bg:oklch(0.96 0.05 30);--risk-ink:oklch(0.50 0.15 30);
  --violet:oklch(0.61 0.21 293);--violet-bg:oklch(0.96 0.03 293);
  --c-ph:oklch(0.48 0.08 210);--c-psi:oklch(0.70 0.12 75);--c-cr:oklch(0.56 0.12 150);
  --cmark:oklch(0.32 0.06 250);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --hd-height:740px;
  position:relative;display:block;container-type:inline-size;container-name:hd;
  font-family:var(--font);font-size:13px;line-height:1.45;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-align:left;
}
.hl-demo *,.hl-demo *::before,.hl-demo *::after{box-sizing:border-box}
.hl-demo button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
.hl-demo :is(div,span,p,table,ul,li){margin:0}
.hl-demo ul{padding:0;list-style:none}
.hl-demo svg{display:block}
.hl-demo .hd-mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hl-demo :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.hl-demo .t-ok{color:var(--ok-ink)}.hl-demo .t-warn{color:var(--warn-ink)}.hl-demo .t-risk{color:var(--risk-ink)}.hl-demo .t-teal{color:var(--teal-ink)}
.hl-demo .t-3{color:var(--ink-3)}.hl-demo .t-4{color:var(--ink-4)}

/* app frame */
.hl-demo .hd-app{display:flex;flex-direction:column;height:var(--hd-height);min-height:520px}
.hl-demo .hd-brand{display:flex;align-items:center;gap:16px;height:56px;flex:none;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line-2)}
.hl-demo .hd-co{display:flex;align-items:center;gap:14px;padding-right:14px;border-right:1px solid var(--line);height:26px;flex:none}
.hl-demo .hd-cmark{width:30px;height:30px;border-radius:7px;background:var(--cmark);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.02em;flex:none}
.hl-demo .hd-orgname{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.hl-demo .hd-orgcap{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:2px;line-height:1}
.hl-demo .hd-pw{display:flex;flex-direction:column;gap:3px;padding-left:0}
.hl-demo .hd-pw small{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);line-height:1}
.hl-demo .hd-pw span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:-.005em;line-height:1}
.hl-demo .hd-pw b{font-weight:500;color:var(--teal-ink);margin-left:-3px}
.hl-demo .hd-sel{position:relative;flex:none}
.hl-demo .hd-selbtn{display:flex;align-items:center;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);transition:border-color .15s}
.hl-demo .hd-selbtn:hover{border-color:var(--mute)}
.hl-demo .hd-selico{width:28px;height:28px;border-radius:7px;background:var(--teal-bg);color:var(--teal);display:grid;place-items:center}
.hl-demo .hd-sellbl{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);line-height:1.1}
.hl-demo .hd-selval{font-size:13px;font-weight:500;line-height:1.2;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.hl-demo .hd-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:30;box-shadow:0 8px 24px rgb(14 22 32/.10)}
.hl-demo .hd-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;font-size:13px}
.hl-demo .hd-menu button:hover{background:var(--bg)}
.hl-demo .hd-menu button[aria-current=true]{background:var(--teal-50);font-weight:600}
.hl-demo .hd-menu i{width:8px;height:8px;border-radius:50%;flex:none}
.hl-demo .hd-sp{flex:1;min-width:0}
.hl-demo .hd-docs{font-size:12px;font-weight:500;color:var(--ink-3)}
.hl-demo .hd-demotag{display:inline-flex;align-items:center;gap:6px;flex:none;padding:3px 9px;border:1px solid var(--line);border-radius:20px;background:var(--panel-2);font-size:11px;font-weight:500;color:var(--ink-3);white-space:nowrap;line-height:1.3}
.hl-demo .hd-demotag i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.hl-demo .hd-bell{position:relative;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2)}
.hl-demo .hd-bell:hover{background:var(--bg)}
.hl-demo .hd-bell em{position:absolute;top:1px;right:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--risk);color:#fff;font:600 10px/16px var(--font);font-style:normal;text-align:center}
.hl-demo .hd-av{width:30px;height:30px;border-radius:50%;background:var(--teal-600);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.hl-demo .hd-nav{display:flex;align-items:stretch;height:44px;flex:none;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.hl-demo .hd-nav::-webkit-scrollbar{display:none}
.hl-demo .hd-nav button{position:relative;display:flex;align-items:center;gap:4px;padding:0 12px;font-size:13px;color:var(--ink-3);white-space:nowrap;transition:color .15s}
.hl-demo .hd-nav button:hover{color:var(--ink-2)}
.hl-demo .hd-nav button[aria-current=page]{color:var(--ink);font-weight:500}
.hl-demo .hd-nav button[aria-current=page]::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--teal-600)}
.hl-demo .hd-nav .hd-end{margin-left:auto}
.hl-demo .hd-main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 24px 28px;scroll-behavior:smooth}
.hl-demo .hd-main>div{animation:hdFade .28s var(--ease) both}
@keyframes hdFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hl-demo .hd-foot{flex:none;display:flex;align-items:center;gap:8px;padding:7px 20px;border-top:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--ink-3)}
.hl-demo .hd-foot i{width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* page title */
.hl-demo .hd-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hl-demo .hd-crumb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.hl-demo .hd-h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:2px 0 4px}
.hl-demo .hd-sub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--ink-3)}
.hl-demo .hd-attn{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:20px;background:var(--risk-bg);color:var(--risk);font-weight:600}
.hl-demo .hd-attn i{width:6px;height:6px;border-radius:50%;background:var(--risk)}
.hl-demo .hd-btns{display:flex;gap:8px;flex-wrap:wrap}
.hl-demo .hd-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px;font-weight:500;transition:background .15s}
.hl-demo .hd-btn:hover{background:var(--panel-2)}
.hl-demo .hd-btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.hl-demo .hd-btn.pri:hover{background:oklch(0.26 0.02 250)}
.hl-demo .hd-btn.sm{padding:5px 10px;font-size:12px}

/* cards */
.hl-demo .hd-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.hl-demo .hd-ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.hl-demo .hd-ct{font-size:13px;font-weight:600;letter-spacing:-.005em}
.hl-demo .hd-ct small{font-weight:400;color:var(--ink-3);margin-left:8px;font-size:12px}
.hl-demo .hd-cb{padding:16px 18px}
.hl-demo .hd-lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);line-height:1}
.hl-demo .hd-row2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-top:12px}
.hl-demo .hd-row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}

/* segmented */
.hl-demo .hd-seg{display:inline-flex;background:var(--line-2);border-radius:6px;padding:2px;gap:0}
.hl-demo .hd-seg button{padding:4px 10px;font-size:11px;font-weight:500;color:var(--ink-3);border-radius:4px;white-space:nowrap}
.hl-demo .hd-seg button[aria-pressed=true]{background:var(--panel);color:var(--ink)}

/* pills / tags */
.hl-demo .hd-pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.hl-demo .hd-pill i{width:6px;height:6px;border-radius:50%}
.hl-demo .p-ok{background:var(--ok-bg);color:var(--ok-ink)}.hl-demo .p-ok i{background:var(--ok)}
.hl-demo .p-warn{background:var(--warn-bg);color:var(--warn-ink)}.hl-demo .p-warn i{background:var(--warn)}
.hl-demo .p-risk{background:var(--risk-bg);color:var(--risk-ink)}.hl-demo .p-risk i{background:var(--risk)}
.hl-demo .p-n{background:var(--line-2);color:var(--ink-3)}.hl-demo .p-n i{background:var(--ink-4)}
.hl-demo .hd-tag{display:inline-flex;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.hl-demo .hd-delta{display:inline-flex;gap:4px;padding:2px 7px;border-radius:4px;font-size:12px;font-weight:500}
.hl-demo .d-up{background:var(--ok-bg);color:var(--ok-ink)}.hl-demo .d-dn{background:var(--risk-bg);color:var(--risk-ink)}.hl-demo .d-fl{background:var(--line-2);color:var(--ink-3)}

/* KPI tiles (portfolio) */
.hl-demo .hd-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.hl-demo .hd-kpi{display:flex;flex-direction:column;height:156px;padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);transition:border-color .2s var(--ease);overflow:hidden;width:100%}
.hl-demo .hd-kpi:hover{border-color:var(--mute)}
.hl-demo .hd-kh{display:flex;align-items:center;gap:8px}
.hl-demo .hd-chip{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.hl-demo .hd-kl{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-demo .hd-kb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.hl-demo .hd-kv{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hl-demo .hd-kf{margin-top:auto;padding-top:8px;font-size:12px;color:var(--ink-4)}
.hl-demo .hd-kd{display:flex;flex-direction:column;justify-content:center;gap:7px;flex:1;margin-top:10px}
.hl-demo .hd-kd div{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3)}
.hl-demo .hd-kd b{font-family:var(--mono);font-weight:600;color:var(--ink)}

/* spectrum */
.hl-demo .hd-spec{position:relative;height:10px;border-radius:5px;margin:26px 6px 8px;background:linear-gradient(90deg,var(--risk-bg) 0 60%,var(--warn-bg) 60% 75%,var(--teal-bg) 75% 85%,var(--ok-bg) 85%)}
.hl-demo .hd-spec button{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 3px rgb(15 23 42/.4);transition:transform .12s var(--ease)}
.hl-demo .hd-spec button:hover,.hl-demo .hd-spec button.on{transform:scale(1.35)}
.hl-demo .hd-spec span{position:absolute;bottom:14px;transform:translateX(-50%);font-size:10px;font-weight:600;white-space:nowrap;color:var(--ink-2);pointer-events:none}
.hl-demo .hd-scale{position:relative;height:14px;font:10px var(--mono);color:var(--ink-4);margin:0 6px}
.hl-demo .hd-scale span{position:absolute;transform:translateX(-50%)}

/* facilities board */
.hl-demo .hd-fac{border-bottom:1px solid var(--line)}
.hl-demo .hd-fac:last-child{border-bottom:0}
.hl-demo .hd-fs{display:grid;grid-template-columns:48px minmax(160px,1.6fr) repeat(4,minmax(54px,.6fr)) minmax(84px,.8fr) 16px;align-items:center;gap:14px;width:100%;padding:14px 18px;transition:background .15s}
.hl-demo .hd-fs:hover{background:var(--bg)}
.hl-demo .hd-fn{font-weight:600;font-size:13px;line-height:1.25}
.hl-demo .hd-fl{font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hl-demo .hd-cell{display:flex;flex-direction:column;gap:2px}
.hl-demo .hd-cell small{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.hl-demo .hd-cell b{font-family:var(--mono);font-size:15px;font-weight:600}
.hl-demo .hd-chev{color:var(--ink-4);transition:transform .2s var(--ease)}
.hl-demo .hd-fac[data-open=true] .hd-chev{transform:rotate(90deg)}
.hl-demo .hd-fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:4px 18px 18px;background:var(--bg);padding-top:14px;border-top:1px solid var(--line-2)}
.hl-demo .hd-fx .hd-card{padding:14px 16px}
.hl-demo .hd-bar{display:grid;grid-template-columns:88px 1fr 28px;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:9px}
.hl-demo .hd-bar i{display:block;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.hl-demo .hd-bar i u{display:block;height:100%;border-radius:3px;text-decoration:none}
.hl-demo .hd-kv2{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:8px}
.hl-demo .hd-kv2 b{font-family:var(--mono);color:var(--ink);font-weight:600}

/* status banner */
.hl-demo .hd-banner{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:10px;background:var(--panel);margin-bottom:12px}
.hl-demo .hd-dot{width:10px;height:10px;border-radius:50%;position:relative}
.hl-demo .hd-dot.ok{background:var(--ok);box-shadow:0 0 0 4px oklch(0.64 0.12 150/.15)}
.hl-demo .hd-dot.warn{background:var(--warn);box-shadow:0 0 0 4px oklch(0.72 0.13 75/.18)}
.hl-demo .hd-dot.risk{background:var(--risk);box-shadow:0 0 0 4px oklch(0.60 0.17 30/.16)}
.hl-demo .hd-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:hdPulse 2s linear infinite}
@keyframes hdPulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.4);opacity:0}}
.hl-demo .hd-bmeta{font-size:11px;color:var(--ink-3);text-align:right;line-height:1.5}

/* hero row */
.hl-demo .hd-hero{display:grid;grid-template-columns:1.4fr 1.4fr 1fr 1fr 1fr;gap:12px}
.hl-demo .hd-tile{display:flex;flex-direction:column;padding:16px 18px 14px;text-align:left;width:100%;transition:border-color .2s var(--ease)}
button.hd-tile:hover,.hl-demo .hd-tile.sel{border-color:var(--teal)}
.hl-demo .hd-gwrap{display:flex;gap:16px;margin-top:12px;align-items:center;flex:1}
.hl-demo .hd-meta{display:flex;flex-direction:column;gap:5px;font-size:12px;min-width:0}
.hl-demo .hd-meta span.k{color:var(--ink-3)}
.hl-demo .hd-big{font-family:var(--mono);font-size:36px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:12px}
.hl-demo .hd-big small{font-size:14px;color:var(--ink-3);font-weight:400;letter-spacing:0;margin-left:3px}
.hl-demo .hd-foot2{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:10px;gap:6px}
.hl-demo .hd-band{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hl-demo .hd-ctx{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.35}
.hl-demo .hd-dash{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}
.hl-demo .hd-dash b{color:var(--teal-ink);font-weight:500}

/* unit table */
.hl-demo .hd-ut{width:100%}
.hl-demo .hd-ur{display:grid;grid-template-columns:minmax(0,1fr) 56px 48px 48px 48px 78px 14px;gap:8px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line-2);width:100%;transition:background .15s}
.hl-demo .hd-uh{padding:9px 18px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);cursor:default}
.hl-demo button.hd-ur:hover{background:var(--bg)}
.hl-demo .hd-ur.on{background:var(--teal-50)}
.hl-demo .hd-ur.weak{background:oklch(0.98 0.02 30/.5)}
.hl-demo .hd-ur.weak.on{background:var(--teal-50)}
.hl-demo .hd-un{display:flex;align-items:center;gap:10px;min-width:0}
.hl-demo .hd-un i{width:3px;height:28px;border-radius:2px;flex:none}
.hl-demo .hd-un b{display:block;font-size:13px;font-weight:600;line-height:1.25}
.hl-demo .hd-un span.d{display:block;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-demo .hd-sq{display:flex;gap:3px;flex-wrap:wrap}
.hl-demo .hd-sq i{width:10px;height:10px;border-radius:2px;display:block}
.hl-demo .hd-ud{padding:14px 18px 18px;background:var(--panel-2);border-bottom:1px solid var(--line-2);animation:hdFade .25s var(--ease) both}
.hl-demo .hd-pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.hl-demo .hd-pc{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px}
.hl-demo .hd-pc .n{font-size:11px;color:var(--ink-3)}
.hl-demo .hd-pc .v{font:600 18px var(--mono);margin-top:2px}
.hl-demo .hd-pc .v small{font:400 11px var(--font);color:var(--ink-3);margin-left:3px}
.hl-demo .hd-pc .r{font-size:10px;color:var(--ink-4);margin-top:2px}

/* chart */
.hl-demo .hd-chart{position:relative;padding:14px 18px 10px}
.hl-demo .hd-plotw{position:relative;margin-left:30px}
.hl-demo .hd-plot{width:100%;height:190px;display:block;cursor:crosshair}
.hl-demo .hd-ya{position:absolute;left:-30px;top:0;height:190px;display:flex;flex-direction:column;justify-content:space-between;font:10px/1 var(--mono);color:var(--ink-4);padding:0}
.hl-demo .hd-xa{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink-4);margin:6px 0 0 30px}
.hl-demo .hd-cross{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--ink-3);pointer-events:none;display:none}
.hl-demo .hd-tip{position:absolute;top:0;z-index:5;background:var(--ink);color:#fff;border-radius:6px;padding:7px 9px;font-size:11px;white-space:nowrap;pointer-events:none;display:none;line-height:1.5}
.hl-demo .hd-tip b{font-family:var(--mono);font-weight:500;margin-left:6px}
.hl-demo .hd-tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.hl-demo .hd-leg{display:flex;gap:14px;flex-wrap:wrap;padding:6px 18px 14px 18px;font-size:11px;color:var(--ink-3)}
.hl-demo .hd-leg button{display:flex;align-items:center;gap:6px;transition:opacity .15s}
.hl-demo .hd-leg button[aria-pressed=false]{opacity:.4;text-decoration:line-through}
.hl-demo .hd-leg i{width:18px;height:2px;border-radius:1px;display:block}

/* lists */
.hl-demo .hd-li{display:flex;align-items:flex-start;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line-2);width:100%}
.hl-demo .hd-li:last-child{border-bottom:0}
.hl-demo button.hd-li:hover{background:var(--bg)}
.hl-demo .hd-ad{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
.hl-demo .hd-li .t{font-size:13px;font-weight:500;line-height:1.35}
.hl-demo .hd-li .m{font-size:11px;color:var(--ink-3);margin-top:2px}
.hl-demo .hd-ax{padding:0 18px 14px 38px;font-size:12px;color:var(--ink-2);line-height:1.5;border-bottom:1px solid var(--line-2);animation:hdFade .25s var(--ease) both}
.hl-demo .hd-ax p{margin-bottom:6px}.hl-demo .hd-ax p b{color:var(--ink)}
.hl-demo .hd-tier{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:14px}
.hl-demo .hd-tier div{height:6px;border-radius:3px;background:var(--line-2)}
.hl-demo .hd-tier div.on{background:var(--teal)}
.hl-demo .hd-tn{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-4);margin:-8px 0 14px}
.hl-demo .hd-tn .on{color:var(--teal-ink)}
.hl-demo .hd-crit{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.hl-demo .hd-crit:last-child{border-bottom:0}
.hl-demo .hd-drv{margin-bottom:12px}
.hl-demo .hd-drv:last-child{margin-bottom:0}
.hl-demo .hd-drv .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:5px}
.hl-demo .hd-drv .h b{font-weight:600}
.hl-demo .hd-drv i{display:block;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.hl-demo .hd-drv u{display:block;height:100%;background:var(--risk);border-radius:3px}

/* measurements table */
.hl-demo .hd-tw{overflow-x:auto}
.hl-demo .hd-mt{width:100%;border-collapse:collapse;min-width:620px}
.hl-demo .hd-mt th{padding:9px 14px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.hl-demo .hd-mt td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13px;white-space:nowrap}

.hl-demo .hd-mt tr.r:hover td{background:var(--bg)}
.hl-demo .hd-mt tr.r.on td{background:var(--teal-50)}
.hl-demo .hd-mt td.n{font-family:var(--mono);font-weight:600}
.hl-demo .hd-fil{display:flex;gap:6px;flex-wrap:wrap}
.hl-demo .hd-fil button{padding:4px 11px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--ink-3);background:var(--panel);transition:all .15s}
.hl-demo .hd-fil button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

.hl-demo .hd-scrim{position:absolute;inset:0;background:oklch(0.17 0.015 250/.55);display:grid;place-items:center;z-index:50;padding:16px;animation:hdFadeO .2s var(--ease) both}

.hl-demo .hd-modal{width:100%;max-width:400px;background:var(--panel);border-radius:12px;padding:20px;animation:hdFade .28s var(--ease) both}
.hl-demo .hd-modal h3{font-size:16px;margin:0 0 4px;font-weight:600;letter-spacing:-.02em}

.hl-demo .hd-fld input,.hl-demo .hd-fld select{display:block;width:100%;margin-top:5px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:13px var(--mono);color:var(--ink);background:var(--panel)}
.hl-demo .hd-fld input:focus,.hl-demo .hd-fld select:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:transparent}
.hl-demo .hd-toast{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:12px;max-width:calc(100% - 32px);animation:hdFade .25s var(--ease) both}

/* ---------- responsive (container-based so it works inside any column) ---------- */
@container hd (max-width:1080px){
  .hl-demo .hd-hero{grid-template-columns:repeat(6,minmax(0,1fr))}

}

  .hl-demo .hd-selval{max-width:110px}
  .hl-demo .hd-gwrap{flex-wrap:wrap}
  .hl-demo .hd-btns{width:100%}
  .hl-demo .hd-demotag{padding:2px 7px;font-size:10px}
  .hl-demo .hd-spec span.hd-alt{bottom:30px}
  .hl-demo .hd-demotag i{display:none}
}
@container hd (max-width:420px){

}
@media (prefers-reduced-motion:reduce){.hl-demo *,.hl-demo *::before,.hl-demo *::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  return '<div style="position:relative;width:124px;height:124px;flex:none"><svg width="124" height="124" viewBox="0 0 124 124" aria-hidden="true"><circle cx="62" cy="62" r="'+r+'" fill="none" stroke="var(--line-2)" stroke-width="11"/><circle cx="62" cy="62" r="'+r+'" fill="none" stroke="'+bcol(b)+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(c*score/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 62 62)"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><div class="hd-mono" style="font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1">'+score+'<span style="font-size:13px;color:var(--ink-3);font-weight:400;letter-spacing:0">/100</span></div><div class="hd-band '+bink(b)+'">'+blabel(score)+'</div></div></div>';

function spark(vals,color,w,h){
  var mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals),rg=mx-mn||1,st=w/(vals.length-1);
  var pts=vals.map(function(v,i){return(i*st).toFixed(1)+','+(h-((v-mn)/rg)*(h-4)-2).toFixed(1)}).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function area(vals,color,w,h){
  var mn=Math.min.apply(0,vals),mx=Math.max.apply(0,vals),rg=mx-mn||1,st=w/(vals.length-1),id='g'+Math.random().toString(36).slice(2,7);
  var line=vals.map(function(v,i){return(i*st).toFixed(1)+','+(h-((v-mn)/rg)*(h-6)-3).toFixed(1)}).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".22"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs><polygon points="0,'+h+' '+line+' '+w+','+h+'" fill="url(#'+id+')"/><polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function chart(id,list,n,dom){
  var W=600,H=190,all=[];list.forEach(function(s){if(!S.aroff[id+s.k])all=all.concat(s.v.slice(-n))});
  var lo=dom?dom[0]:Math.max(0,Math.floor((Math.min.apply(0,all.length?all:[40])-6)/10)*10),hi=dom?dom[1]:100;
  var ticks=[0,1,2,3].map(function(i){return Math.round(hi-(hi-lo)*i/3)});
  var g=ticks.map(function(t,i){var y=(i/3)*(H-1)+.5;return'<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--line-2)" stroke-width="1" vector-effect="non-scaling-stroke"/>'}).join('');
  var paths=list.map(function(s){
    if(S.aroff[id+s.k])return'';
    var v=s.v.slice(-n),st=W/(v.length-1);
    return'<polyline fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="'+v.map(function(y,i){return(i*st).toFixed(1)+','+((hi-y)/(hi-lo)*(H-4)+2).toFixed(1)}).join(' ')+'"/>';
  }).join('');
  CH[id]={list:list,n:n,lo:lo,hi:hi,H:H};
  var xs=[0,.25,.5,.75,1].map(function(p){return'<span>'+dateAt(Math.round(p*(n-1)),n)+'</span>'}).join('');
  var leg=list.map(function(s){return'<button data-act="leg" data-c="'+id+'" data-k="'+s.k+'" aria-pressed="'+!S.aroff[id+s.k]+'"><i style="background:'+s.c+'"></i>'+s.l+'</button>'}).join('');
  return'<div class="hd-chart"><div class="hd-plotw"><div class="hd-ya">'+ticks.map(function(t){return'<span>'+t+'</span>'}).join('')+'</div><svg class="hd-plot" data-chart="'+id+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Score trend chart">'+g+paths+'<line x1="'+(W-.5)+'" x2="'+(W-.5)+'" y1="0" y2="'+H+'" stroke="var(--ink)" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/></svg><div class="hd-cross"></div><div class="hd-tip"></div></div><div class="hd-xa">'+xs+'</div></div><div class="hd-leg">'+leg+'</div>';
}
function hover(e){

  var c=CH[p.getAttribute('data-chart')];if(!c)return;
  var rc=p.getBoundingClientRect(),fx=clamp((e.clientX-rc.left)/rc.width,0,1),i=Math.round(fx*(c.n-1));
  var wrap=p.parentNode,cr=wrap.querySelector('.hd-cross'),tp=wrap.querySelector('.hd-tip');
  var x=i/(c.n-1)*rc.width;cr.style.display='block';cr.style.left=x+'px';
  var rows=c.list.filter(function(s){return!S.aroff[p.getAttribute('data-chart')+s.k]}).map(function(s){return'<div><i style="background:'+s.c+'"></i>'+s.l+'<b>'+fmt(s.v.slice(-c.n)[i])+'</b></div>'}).join('');

  var banner='<div class="hd-banner" style="border-left-color:'+bcol(b)+'"><span class="hd-dot '+mood+'"></span><div style="font-size:13px"><b>'+msg[0]+'.</b> '+msg[1]+'</div><div class="hd-bmeta">'+Math.round(f.dc*.21)+'/21 points today<br>last entry 05:42 · next run 07:00</div></div>';

  var list=ALERTS.filter(function(a){return(S.fid==='all'||a.f===S.fid)&&(S.sev==='all'||a.sev===S.sev)});
  var rows=list.map(function(a){var on=S.open[a.id],ff=byId(a.f);
   return'<button class="hd-li" data-act="alert" data-id="'+a.id+'" aria-expanded="'+!!on+'" style="'+(a.ack?'opacity:.55':'')+'"><i class="hd-ad" style="background:'+SEVC[a.sev]+'"></i><span style="flex:1;min-width:0"><div class="t">'+a.t+'</div><div class="m">'+ff.name+' · '+a.w+' · '+a.e+'</div></span><span class="hd-pill '+(a.ack?'p-ok':SEVT[a.sev])+'">'+(a.ack?'Acknowledged':a.sev[0].toUpperCase()+a.sev.slice(1))+'</span></button>'+

/* ---------------- render ---------------- */
/* keyboard focus survives re-renders: remember the focused control, find its twin afterwards */
var KBD=false,FA=['act','id','v','k','r','i','n','s','c'];
document.addEventListener('keydown',function(){KBD=true},true);
document.addEventListener('pointerdown',function(){KBD=false},true);
function focusSave(){
  var a=document.activeElement;if(!a||a===root||!root.contains(a))return null;
  if(a.closest('.hd-modal'))return{modal:1};
  if(!a.getAttribute('data-act'))return null;
  var sel=FA.map(function(k){var v=a.getAttribute('data-'+k);return v==null?'':'[data-'+k+'="'+(window.CSS&&CSS.escape?CSS.escape(v):v)+'"]'}).join('');
  return{sel:sel,i:Array.prototype.indexOf.call(root.querySelectorAll(sel),a)};
}
function focusRestore(f){
  var el=null;
  if(S.modal){if(!root.querySelector('.hd-modal').contains(document.activeElement))el=root.querySelector('.hd-modal select')}
  else if(f&&f.modal)el=root.querySelector('[data-act="modal"]');
  else if(f&&KBD){var l=root.querySelectorAll(f.sel);el=l[f.i]||l[0]||null}
  if(el)try{el.focus({preventScroll:true})}catch(e){}
}
function render(keep){
  var m=root.querySelector('.hd-main'),st=m?m.scrollTop:0,fs=focusSave();
  var body={portfolio:portfolio,dashboard:dashboard,data:data,alerts:alerts,analytics:analytics}[S.view]||stub;
  root.innerHTML='<div class="hd-app">'+header()+'<main class="hd-main" id="hd-main"><div'+(keep?' style="animation:none"':'')+'>'+body()+'</div></main><div class="hd-foot"><i></i>Interactive demo · sample data, nothing is sent anywhere</div></div>'+(S.modal?modal():'')+(S.toast?'<div class="hd-toast" role="status">'+S.toast+'</div>':'');
  if(keep){root.querySelector('.hd-main').scrollTop=st}
  focusRestore(fs);
}
// body() returns the wrapper too for most views; unwrap the double <div>
var _r=render;render=function(k){_r(k)};

/* ---------------- events ---------------- */
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(S.menu&&!(el&&el.getAttribute('data-act')==='menu')&&!e.target.closest('.hd-menu')){S.menu=false;if(!el){render(true);return}}
  if(!el)return;
  if(el.getAttribute('data-act')==='close'&&e.target.closest('[data-stop]')&&el.classList.contains('hd-scrim'))return;
  var a=el.getAttribute('data-act'),g=function(k){return el.getAttribute('data-'+k)};
  switch(a){
   case'menu':S.menu=!S.menu;render(true);return;
   case'fac':S.fid=g('id');S.menu=false;S.unit=null;S.mrow=null;S.mf='All';if(S.fid!=='all'&&S.view==='portfolio')S.view='dashboard';if(S.fid==='all'&&(S.view==='dashboard'||S.view==='data'))S.view='portfolio';render();return;
   case'nav':if(g('v')==='ops'||g('v')==='fac'||g('v')==='org'||g('v')==='admin'||g('v')==='help'){S.view='stub'}else S.view=g('v');if(S.view==='dashboard'||S.view==='data')needF();S.menu=false;S.sev='all';render();return;
   case'kpi':S.kpi[g('k')]=!S.kpi[g('k')];render(true);return;
   case'facrow':S.fac[g('id')]=!S.fac[g('id')];render(true);return;
   case'spec':S.fac[g('id')]=true;render(true);var t=root.querySelector('#hdf-'+g('id')),mm=root.querySelector('.hd-main');if(t&&mm){mm.scrollTo({top:Math.max(0,t.getBoundingClientRect().top-mm.getBoundingClientRect().top+mm.scrollTop-(mm.clientHeight-t.offsetHeight)/2),behavior:'smooth'})}return;
   case'open':S.fid=g('id');S.view=g('v');S.unit=null;S.mrow=null;S.mf='All';render();return;
   case'unit':S.unit=S.unit===+g('i')?null:+g('i');render(true);return;
   case'range':S.range=+g('r');render(true);return;
   case'arange':S.aRange=+g('r');render(true);return;
   case'leg':S.aroff[g('c')+g('k')]=!S.aroff[g('c')+g('k')];render(true);return;
   case'seriesTog':S.aroff['dash'+g('k')]=false;toast('Showing it on the trend chart below');return;
   case'mf':S.mf=g('n');S.mrow=null;render(true);return;
   case'mrow':S.mrow=S.mrow===g('id')?null:g('id');render(true);return;
   case'sev':S.sev=g('s');render(true);return;
   case'alert':S.open[g('id')]=!S.open[g('id')];render(true);return;
   case'ack':ALERTS.forEach(function(x){if(x.id==+g('id'))x.ack=true});render(true);toast('Alert acknowledged. The engines keep watching.');return;
   case'toast':toast(g('m'));return;
   case'modal':S.modal=true;render(true);return;
   case'close':S.modal=false;render(true);return;
   case'save':S.modal=false;render(true);toast('Readings saved. Scores recompute at the next run (07:00).');return;
  }
});
root.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&(S.modal||S.menu)){S.modal=false;S.menu=false;render(true)}
});
root.addEventListener('mousemove',hover);
root.addEventListener('mouseout',leave);
render();
})();

<script>
/* Embedding: report this document's height to the host page so it can size the iframe. */
(function(){
  var DEMO='lite',raf=0;
  if(window.parent===window)return;
  function height(){
    var b=document.body,d=document.documentElement;
    /* body height, not documentElement.scrollHeight alone: the root can never report less than the current iframe height */
    return Math.ceil(Math.max(b.scrollHeight,b.getBoundingClientRect().height))||d.scrollHeight;
  }
  function post(){raf=0;try{window.parent.postMessage({type:'hydris-demo-height',demo:DEMO,height:height()},'*')}catch(e){}}
  function schedule(){if(!raf)raf=window.requestAnimationFrame(post)}
  window.addEventListener('load',schedule);
  window.addEventListener('resize',schedule);
  if(window.ResizeObserver){try{new ResizeObserver(schedule).observe(document.body)}catch(e){}}
  schedule();
})();
</script>
